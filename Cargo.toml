[package]
name = "bb-ref"
version = "0.1.0"
edition = "2021"
description = "Minimal Rust reference implementation of barretenberg's UltraHonk and Chonk provers/verifiers"

[dependencies]
ark-ff = { version = "0.6", features = ["parallel"] }
ark-ec = { version = "0.6", features = ["parallel"] }
ark-bn254 = "0.6"
ark-grumpkin = "0.6"
ark-serialize = "0.6"
ark-std = "0.6"
serde = { version = "1", features = ["derive"] }
rmp-serde = "1.3"
hex = "0.4"
rand = "0.8"
flate2 = "1"
base64 = "0.22"
serde_json = "1"
sha2 = "0.10"
blake3 = "1.8.5"
rayon = "1.11"
num-bigint = "0.4"
ark-secp256r1 = "0.6.0"
ark-secp256k1 = "0.6.0"

[profile.dev]
opt-level = 1

[profile.test]
opt-level = 1
