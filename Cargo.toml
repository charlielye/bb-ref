[package]
name = "bb-ref"
version = "0.1.0"
edition = "2021"
description = "Minimal Rust reference implementation of barretenberg's UltraHonk and Chonk provers/verifiers"

[dependencies]
ark-ff = { version = "0.6", features = ["parallel", "asm"] }
ark-ec = { version = "0.6", features = ["parallel"] }
ark-bn254 = "0.6"
ark-grumpkin = "0.6"
ark-serialize = "0.6"
ark-std = "0.6"
serde = { version = "1", features = ["derive"] }
rmp-serde = "1.3"
hex = "0.4"
rand = "0.8"
flate2 = "1"
base64 = "0.22"
serde_json = "1"
sha2 = "0.10"
blake3 = "1.8.5"
rayon = "1.11"
num-bigint = "0.4"
ark-secp256r1 = "0.6.0"
ark-secp256k1 = "0.6.0"
dhat = { version = "0.3.3", optional = true }

[target.'cfg(target_family = "wasm")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
mimalloc = { version = "0.1", optional = true }

[profile.release]
opt-level = 2

# Release/benchmark wasm builds: opt-level 3 + fat LTO + one codegen unit measured -1.3% on the
# chonk flow (4/4 interleaved; opt-level 3 alone and native LTO are neutral). Slow to build; the
# default release profile stays opt-level 2 for iteration.
[profile.lto]
inherits = "release"
opt-level = 3
lto = "fat"
codegen-units = 1

[profile.dev]
opt-level = 1

[profile.test]
opt-level = 1

[features]
# Heap profiling: dhat replaces mimalloc as the global allocator and writes dhat-heap.json.
heap-profile = ["dep:dhat"]
# A/B reference: mimalloc instead of the system allocator.
mimalloc = ["dep:mimalloc"]
dhat = ["dep:dhat"]

# Vendored ark-ff 0.6.0 with one class of change: `#[inline(always)]` on the Fp operator and
# FpConfig wrappers (mul/add/sub/square), which stock ark-ff leaves as outlined calls at every
# hot site — measured -31G instructions and -3.5% wall on a rollup merge, -5% on the chonk flow.
[patch.crates-io]
ark-ff = { path = "vendor/ark-ff" }
