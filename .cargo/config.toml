# ark-ff's x86-64 Montgomery mul/sqr assembly (the "asm" feature) only compiles in when bmi2 and
# adx are compile-time target features; without these flags the generic Rust CIOS loop runs instead.
#
# inline-threshold: stock ark-ff leaves its field-operator wrappers as `#[inline]` hints that LLVM
# declines at the default threshold (2,945 outlined `mul_assign` call sites), which costs ~5% of
# native proving on the reference box; at 1000 the wrappers inline (499 sites) and the chonk and
# corpus tables return to their pre-stock level (bench-results/LADDER.md, Update 63). 2000 measured
# identical with a larger binary. The alternative was patching the attributes into a vendored ark-ff.
[target.'cfg(target_arch = "x86_64")']
rustflags = ["-C", "target-feature=+bmi2,+adx", "-C", "llvm-args=-inline-threshold=1000"]

# wasm: simd128 for the packed kernels (`src/base/wasm/`), 4 GiB of addressable memory (the biggest
# flow needs >1 GiB), and inline expansion of constant-size memcpy/memset up to 48 stores. V8 lowers
# every `memory.copy`/`memory.fill` to a C call (13 ns for 264 B against 5 ns inline), and LLVM's
# default limit leaves every by-value move of a 264-byte `Graded<Fr, 8>` as one; 48 takes the
# relation bodies to none (24 changes nothing). A RUSTFLAGS variable replaces this list entirely,
# so build wasm without one; `tools/wasm_check.sh` fails a module built without these flags.
[target.wasm32-wasip1-threads]
rustflags = [
    "-C", "target-feature=+simd128", "-C", "link-arg=--max-memory=4294967296",
    "-C", "llvm-args=-max-store-memcpy=48", "-C", "llvm-args=-max-store-memset=48",
]

# Test binaries otherwise run one rayon pool per process at the machine's core count while cargo
# runs binaries and tests concurrently; on large machines that oversubscribes by orders of magnitude.
[env]
RAYON_NUM_THREADS = { value = "16", force = false }
RUST_TEST_THREADS = { value = "4", force = false }
